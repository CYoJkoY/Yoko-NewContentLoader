name: Build Mod Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build and release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '3.7-dev1'
  GODOT_DOWNLOAD_URL: 'https://downloads.godotengine.org/?version=3.7&flavor=dev1&platform=linux_headless.64&slug=linux_headless.64.zip'

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag '$TAG'. Expected vX.Y.Z."; exit 1; }
          VERSION="${TAG#v}"
          printf 'tag=%s\nversion=%s\n' "$TAG" "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate manifest
        id: manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('manifest.json')
          if not path.is_file(): raise SystemExit('manifest.json is missing')
          data=json.loads(path.read_text(encoding='utf-8-sig'))
          for key in ('name','namespace','version_number','description'):
              value=data.get(key)
              if not isinstance(value,str) or not value.strip(): raise SystemExit(f'Invalid manifest field: {key}')
          for key in ('name','namespace'):
              value=data[key].strip()
              if '/' in value or '\\' in value or value in {'.','..'}: raise SystemExit(f'Invalid manifest.{key}: {value!r}')
          manifest_version=data['version_number'].strip(); release_version=os.environ['VERSION'].strip()
          if manifest_version != release_version: raise SystemExit(f'Manifest version mismatch: manifest.json has {manifest_version!r}, but the release tag requests {release_version!r}.')
          name=data['name'].strip(); namespace=data['namespace'].strip()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              print(f'name={name}',file=out); print(f'namespace={namespace}',file=out); print(f'mod_directory={namespace}-{name}',file=out); print(f'zip_name={name}-{release_version}.zip',file=out)
          PY
      - name: Prepare isolated project
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/mod-project"; MOD_ROOT="$PROJECT/mods-unpacked/$MOD_DIRECTORY"
          rm -rf "$PROJECT"; mkdir -p "$MOD_ROOT"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.godot/' --exclude='.import/' --exclude='dist/' --exclude='ci/' --exclude='project.godot' --exclude='project.godot.*' --exclude='export_presets.cfg' --exclude='.DS_Store' --exclude='desktop.ini' --exclude='.gitignore' --exclude='.gitattributes' "$GITHUB_WORKSPACE/" "$MOD_ROOT/"
          cat > "$PROJECT/project.godot" <<'GODOT'
          config_version=4
          [application]
          config/name="Mod Release Import"
          run/main_scene=""
          [display]
          window/size/width=1280
          window/size/height=720
          GODOT
          printf 'PROJECT=%s\nMOD_ROOT=%s\n' "$PROJECT" "$MOD_ROOT" >> "$GITHUB_ENV"
      - name: Detect import metadata
        id: imports
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find "$MOD_ROOT" -type f -name '*.import' | wc -l)"
          echo "Import metadata files detected: $COUNT"
          if (( COUNT > 0 )); then echo 'has_import=true' >> "$GITHUB_OUTPUT"; else echo 'has_import=false' >> "$GITHUB_OUTPUT"; echo 'No *.import metadata found; Godot import generation will be skipped.'; fi
      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.imports.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot"; mkdir -p "$GODOT_DIR"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "$GODOT_DOWNLOAD_URL" --output "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -type f -name 'Godot_v3.7-dev1_linux_headless.64' -print -quit)"
          [[ -n "$GODOT_BIN" ]] || { echo '::error::Godot executable not found.'; exit 1; }
          chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"; "$GODOT_BIN" --version
      - name: Validate import source paths
        if: steps.imports.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          project=Path(os.environ['PROJECT']); mod_root=Path(os.environ['MOD_ROOT'])
          pattern=re.compile(r'^source_file="(res://[^"\\]+)"$'); mismatches=[]; missing=[]; count=0
          for meta in mod_root.rglob('*.import'):
              count+=1
              for line in meta.read_text(encoding='utf-8',errors='replace').splitlines():
                  m=pattern.match(line.strip())
                  if not m: continue
                  source=m.group(1).removeprefix('res://'); p=project/source
                  if p.is_file(): continue
                  candidates=[x.name for x in p.parent.iterdir() if x.name.lower()==p.name.lower()] if p.parent.is_dir() else []
                  if candidates: mismatches.append((meta.relative_to(mod_root),source,candidates[0])); continue
                  missing.append((meta.relative_to(mod_root),source))
          print(f'Import metadata files checked: {count}')
          for a,b,c in mismatches: print(f'  CASE: {a}: {b} -> {c}')
          for a,b in missing: print(f'  MISSING: {a}: {b}')
          if mismatches or missing: raise SystemExit(1)
          print('All import metadata source paths match files exactly on the case-sensitive filesystem.')
          PY
      - name: Import resources with Godot
        if: steps.imports.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/godot-import.log"; IMPORT_DIR="$PROJECT/.import"
          rm -rf "$IMPORT_DIR"; mkdir -p "$IMPORT_DIR"
          "$GODOT_BIN" --path "$PROJECT" --editor --headless --audio-driver Dummy >"$LOG_FILE" 2>&1 & GODOT_PID=$!
          cleanup(){ kill "$GODOT_PID" 2>/dev/null || true; wait "$GODOT_PID" 2>/dev/null || true; }; trap cleanup EXIT
          DEADLINE="$(($(date +%s)+300))"; LAST_COUNT=-1; STABLE=0; FINISHED=0
          while (( $(date +%s) < DEADLINE )); do
            COUNT="$(find "$IMPORT_DIR" -type f ! -name '.gdignore' | wc -l)"
            if (( COUNT == LAST_COUNT )); then STABLE=$((STABLE+1)); else LAST_COUNT="$COUNT"; STABLE=0; fi
            echo "Imported cache files: $COUNT; stable checks: $STABLE"
            if (( COUNT > 0 && STABLE >= 8 )); then FINISHED=1; break; fi
            if ! kill -0 "$GODOT_PID" 2>/dev/null; then echo 'Godot process exited; validating the generated cache.'; break; fi
            sleep 1
          done
          if (( FINISHED == 0 && $(date +%s) >= DEADLINE )); then echo '::error::Godot resource import did not reach a stable state within 300 seconds.'; cat "$LOG_FILE" >&2 || true; exit 1; fi
          if kill -0 "$GODOT_PID" 2>/dev/null; then echo 'Import cache validation complete; stopping Godot.'; kill "$GODOT_PID" 2>/dev/null || true; fi
          wait "$GODOT_PID" 2>/dev/null || true
          PROJECT="$PROJECT" MOD_ROOT="$MOD_ROOT" python3 - <<'PY'
          import os,re
          from pathlib import Path
          project=Path(os.environ['PROJECT']); mod_root=Path(os.environ['MOD_ROOT']); import_dir=project/'.import'
          expected=set(); metadata_count=0
          destination_pattern=re.compile(r'"(res://\.import/[^"\\]+)"'); path_pattern=re.compile(r'path="(res://\.import/[^"\\]+)"')
          for meta in mod_root.rglob('*.import'):
              metadata_count+=1; text=meta.read_text(encoding='utf-8',errors='replace'); expected.update(destination_pattern.findall(text))
              for line in text.splitlines():
                  m=path_pattern.search(line.strip())
                  if m: expected.add(m.group(1))
          actual={f'res://.import/{p.relative_to(import_dir).as_posix()}' for p in import_dir.rglob('*') if p.is_file()}
          print(f'Import metadata files: {metadata_count}'); print(f'Declared generated artifacts: {len(expected)}'); print(f'Actual .import cache files: {len(actual)}')
          missing=sorted(expected-actual)
          if missing:
              print('Missing generated import artifacts:')
              for path in missing: print(f'  - {path}')
              raise SystemExit(1)
          print('All declared Godot import artifacts are present.')
          PY
      - name: Build ModLoader package
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          HAS_IMPORT: ${{ steps.imports.outputs.has_import }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-stage"; RELEASE="$RUNNER_TEMP/release"; ZIP="$RELEASE/$ZIP_NAME"
          rm -rf "$STAGE" "$RELEASE"; mkdir -p "$STAGE/mods-unpacked/$MOD_DIRECTORY" "$RELEASE"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.godot/' --exclude='.import/' --exclude='project.godot' --exclude='project.godot.*' --exclude='export_presets.cfg' --exclude='.DS_Store' --exclude='desktop.ini' --exclude='.gitignore' --exclude='.gitattributes' "$MOD_ROOT/" "$STAGE/mods-unpacked/$MOD_DIRECTORY/"
          if [[ "$HAS_IMPORT" == 'true' ]]; then
            [[ -d "$PROJECT/.import" ]] || { echo '::error::Godot did not generate the .import cache.'; exit 1; }
            IMPORT_COUNT="$(find "$PROJECT/.import" -type f ! -name '.gdignore' | wc -l)"
            if (( IMPORT_COUNT == 0 )); then echo '::error::Generated .import cache is empty.'; exit 1; fi
            mkdir -p "$STAGE/.import"; rsync -a --exclude='.gdignore' "$PROJECT/.import/" "$STAGE/.import/"
          else echo 'No *.import metadata; no Godot .import cache is required for this Mod.'; fi
          find "$STAGE" -type f \( -name '.gdignore' -o -name '*.md5' -o -name '*.csv.import' \) -delete
          (cd "$STAGE" && zip -r -q -9 -n '.png:.webp:.jpg:.jpeg:.gif:.bmp:.ico:.dds:.stex:.ctex:.ogg:.oggstr:.mp3:.aac:.m4a:.mp4:.webm:.zip:.7z:.rar:.gz:.bz2:.xz:.zst' "$ZIP" .); test -s "$ZIP"; sha256sum "$ZIP" > "$ZIP.sha256"
      - name: Verify release package
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_IMPORT: ${{ steps.imports.outputs.has_import }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/release/$ZIP_NAME"; MANIFEST_PATH="mods-unpacked/$MOD_DIRECTORY/manifest.json"
          unzip -t "$ZIP" >/dev/null; LISTING="$RUNNER_TEMP/zip-list.txt"; unzip -Z1 "$ZIP" > "$LISTING"
          grep -Fxq "$MANIFEST_PATH" "$LISTING" || { echo '::error::manifest.json is missing from the expected ModLoader path.'; exit 1; }
          if grep -Eq '(^|/)(\.git|\.github|\.godot)(/|$)' "$LISTING"; then echo '::error::Development directories leaked into the release package.'; exit 1; fi
          if grep -Eq '(^|/)(\.gdignore|.*\.md5|.*\.csv\.import)$' "$LISTING"; then echo '::error::Forbidden generated files leaked into the release package.'; exit 1; fi
          if [[ "$HAS_IMPORT" == 'true' ]] && ! grep -Eq '^\.import/[^/]+$|^\.import/.+/.+$' "$LISTING"; then echo '::error::Generated .import cache is missing from the release package.'; exit 1; fi
          unzip -p "$ZIP" "$MANIFEST_PATH" > "$RUNNER_TEMP/release-manifest.json"
          VERSION="$VERSION" MANIFEST="$RUNNER_TEMP/release-manifest.json" python3 - <<'PY'
          import json,os
          from pathlib import Path
          expected=os.environ['VERSION']; actual=json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8')).get('version_number')
          if actual != expected: raise SystemExit(f'Release manifest version mismatch: {actual!r} != {expected!r}')
          PY
      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.manifest.outputs.name }}-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
            ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP/release/$ZIP_NAME" "$RUNNER_TEMP/release/$ZIP_NAME.sha256" --title "$ZIP_NAME" --generate-notes
