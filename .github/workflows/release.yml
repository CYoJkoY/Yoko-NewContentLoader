name: Build Mod Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build and release'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  GODOT_VERSION: '3.7-dev1'
  GODOT_DOWNLOAD_URL: 'https://downloads.godotengine.org/?version=3.7&flavor=dev1&platform=linux_headless.64&slug=linux_headless.64.zip'
jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag '$TAG'. Expected vX.Y.Z."; exit 1; }
          VERSION="${TAG#v}"
          { echo "tag=$TAG"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
      - name: Validate manifest
        id: manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('manifest.json').read_text(encoding='utf-8-sig')) if Path('manifest.json').is_file() else (_ for _ in ()).throw(SystemExit('manifest.json is missing'))
          for key in ('name','namespace','version_number','description'):
              if not isinstance(data.get(key),str) or not data[key].strip(): raise SystemExit(f'Invalid manifest field: {key}')
          for key in ('name','namespace'):
              value=data[key].strip()
              if '/' in value or '\\' in value or value in {'.','..'}: raise SystemExit(f'Invalid manifest.{key}: {value!r}')
          release=os.environ['VERSION'].strip(); manifest=data['version_number'].strip()
          if manifest != release: raise SystemExit(f'Manifest version mismatch: {manifest!r} != {release!r}')
          name=data['name'].strip(); namespace=data['namespace'].strip()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              print(f'name={name}',file=out); print(f'namespace={namespace}',file=out); print(f'mod_directory={namespace}-{name}',file=out); print(f'zip_name={name}-{release}.zip',file=out)
          PY
      - name: Prepare isolated project
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/mod-project"; MOD_ROOT="$PROJECT/mods-unpacked/$MOD_DIRECTORY"
          rm -rf "$PROJECT"; mkdir -p "$MOD_ROOT"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.godot/' --exclude='.import/' --exclude='dist/' --exclude='ci/' --exclude='project.godot' --exclude='project.godot.*' --exclude='export_presets.cfg' --exclude='.DS_Store' --exclude='desktop.ini' --exclude='.gitignore' --exclude='.gitattributes' "$GITHUB_WORKSPACE/" "$MOD_ROOT/"
          cat > "$PROJECT/project.godot" <<'GODOT'
          config_version=4
          [application]
          config/name="Mod Release Import"
          run/main_scene=""
          GODOT
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"; echo "MOD_ROOT=$MOD_ROOT" >> "$GITHUB_ENV"
      - name: Detect import metadata
        id: imports
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find "$MOD_ROOT" -type f -name '*.import' | wc -l)"
          echo "Import metadata files detected: $COUNT"
          if (( COUNT > 0 )); then echo 'has_import=true' >> "$GITHUB_OUTPUT"; else echo 'has_import=false' >> "$GITHUB_OUTPUT"; echo 'No *.import metadata found; Godot import generation will be skipped.'; fi
      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.imports.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/godot"; mkdir -p "$D"
          curl --fail --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "$GODOT_DOWNLOAD_URL" -o "$D/godot.zip"
          unzip -q "$D/godot.zip" -d "$D"
          GODOT_BIN="$(find "$D" -type f -name 'Godot_v3.7-dev1_linux_headless.64' -print -quit)"
          [[ -n "$GODOT_BIN" ]] || { echo '::error::Godot executable not found.'; exit 1; }
          chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"; "$GODOT_BIN" --version
      - name: Validate import source paths
        if: steps.imports.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          project=Path(os.environ['PROJECT']); root=Path(os.environ['MOD_ROOT']); pat=re.compile(r'^source_file="(res://[^"\\]+)"$'); bad=[]
          for meta in root.rglob('*.import'):
              for line in meta.read_text(encoding='utf-8',errors='replace').splitlines():
                  m=pat.match(line.strip())
                  if not m: continue
                  source=m.group(1).removeprefix('res://'); p=project/source
                  if p.is_file(): continue
                  candidates=[x.name for x in p.parent.iterdir() if x.name.lower()==p.name.lower()] if p.parent.is_dir() else []
                  bad.append((meta.relative_to(root),source,candidates[0] if candidates else None))
          for item in bad: print('CASE/MISSING:',item)
          if bad: raise SystemExit(1)
          PY
      - name: Import resources with Godot
        if: steps.imports.outputs.has_import == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/godot-import.log"; DIR="$PROJECT/.import"; rm -rf "$DIR"
          "$GODOT_BIN" --path "$PROJECT" --editor --headless --audio-driver Dummy >"$LOG" 2>&1 & PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }; trap cleanup EXIT
          END="$(($(date +%s)+300))"; LAST=-1; STABLE=0
          while (( $(date +%s) < END )); do
            COUNT="$(find "$DIR" -type f ! -name '.gdignore' 2>/dev/null | wc -l)"
            if (( COUNT == LAST )); then STABLE=$((STABLE+1)); else LAST="$COUNT"; STABLE=0; fi
            echo "Imported cache files: $COUNT; stable checks: $STABLE"
            if (( COUNT > 0 && STABLE >= 8 )); then break; fi
            sleep 1
          done
          if ! (( LAST > 0 && STABLE >= 8 )); then echo '::error::Godot import did not reach a stable state within 300 seconds.'; cat "$LOG" >&2 || true; exit 1; fi
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          project=Path(os.environ['PROJECT']); root=Path(os.environ['MOD_ROOT']); d=project/'.import'; expected=set()
          for meta in root.rglob('*.import'):
              text=meta.read_text(encoding='utf-8',errors='replace')
              expected.update(re.findall(r'"(res://\.import/[^"\\]+)"',text))
              expected.update(re.findall(r'path="(res://\.import/[^"\\]+)"',text))
          actual={f'res://.import/{p.relative_to(d).as_posix()}' for p in d.rglob('*') if p.is_file()}
          missing=sorted(expected-actual)
          print(f'Declared generated artifacts: {len(expected)}'); print(f'Actual .import cache files: {len(actual)}')
          if missing:
              for x in missing: print(f'  - {x}')
              raise SystemExit(1)
          PY
      - name: Build ModLoader package
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          HAS_IMPORT: ${{ steps.imports.outputs.has_import }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-stage"; OUT="$RUNNER_TEMP/release"; ZIP="$OUT/$ZIP_NAME"
          rm -rf "$STAGE" "$OUT"; mkdir -p "$STAGE/mods-unpacked/$MOD_DIRECTORY" "$OUT"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.godot/' --exclude='.import/' --exclude='project.godot' --exclude='project.godot.*' --exclude='export_presets.cfg' --exclude='.DS_Store' --exclude='desktop.ini' --exclude='.gitignore' --exclude='.gitattributes' "$MOD_ROOT/" "$STAGE/mods-unpacked/$MOD_DIRECTORY/"
          if [[ "$HAS_IMPORT" == 'true' ]]; then
            [[ -d "$PROJECT/.import" ]] || { echo '::error::Godot did not generate the .import cache.'; exit 1; }
            C="$(find "$PROJECT/.import" -type f ! -name '.gdignore' | wc -l)"; if (( C == 0 )); then echo '::error::.import cache is empty.'; exit 1; fi
            mkdir -p "$STAGE/.import"; rsync -a --exclude='.gdignore' "$PROJECT/.import/" "$STAGE/.import/"
          fi
          find "$STAGE" -type f \( -name '.gdignore' -o -name '*.md5' -o -name '*.csv.import' \) -delete
          (cd "$STAGE" && zip -r -q -9 -n '.png:.webp:.jpg:.jpeg:.gif:.bmp:.ico:.dds:.stex:.ctex:.ogg:.oggstr:.mp3:.aac:.m4a:.mp4:.webm:.zip:.7z:.rar:.gz:.bz2:.xz:.zst' "$ZIP" .)
          test -s "$ZIP"; sha256sum "$ZIP" > "$ZIP.sha256"
      - name: Verify release package
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_IMPORT: ${{ steps.imports.outputs.has_import }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/release/$ZIP_NAME"; MANIFEST_PATH="mods-unpacked/$MOD_DIRECTORY/manifest.json"; unzip -t "$ZIP" >/dev/null; LISTING="$RUNNER_TEMP/zip-list.txt"; unzip -Z1 "$ZIP" > "$LISTING"
          grep -Fxq "$MANIFEST_PATH" "$LISTING" || { echo '::error::manifest.json missing.'; exit 1; }
          if grep -Eq '(^|/)(\.git|\.github|\.godot)(/|$)' "$LISTING"; then echo '::error::Development directories leaked.'; exit 1; fi
          if grep -Eq '(^|/)(\.gdignore|.*\.md5|.*\.csv\.import)$' "$LISTING"; then echo '::error::Forbidden generated file leaked.'; exit 1; fi
          if [[ "$HAS_IMPORT" == 'true' ]] && ! grep -Eq '^\.import/[^/]+$|^\.import/.+/.+$' "$LISTING"; then echo '::error::.import cache missing.'; exit 1; fi
          unzip -p "$ZIP" "$MANIFEST_PATH" > "$RUNNER_TEMP/release-manifest.json"
          VERSION="$VERSION" MANIFEST="$RUNNER_TEMP/release-manifest.json" python3 - <<'PY'
          import json,os
          from pathlib import Path
          expected=os.environ['VERSION']; actual=json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8')).get('version_number')
          if actual != expected: raise SystemExit(f'Release manifest version mismatch: {actual!r} != {expected!r}')
          PY
      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.manifest.outputs.name }}-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
            ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.manifest.outputs.name }} ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
            ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}.sha256
